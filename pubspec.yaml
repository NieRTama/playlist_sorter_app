name: playlist_sorter
description: ローカル音楽ファイルをスワイプで整理するプレイリストアプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.3
  file_picker: ^8.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  provider: ^6.1.2
  on_audio_query: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
