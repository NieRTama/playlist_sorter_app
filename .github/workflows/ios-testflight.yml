name: iOS TestFlight

# Builds a signed IPA with cloud-managed signing and uploads it to App Store Connect.
# Required secrets: APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64
# Required variable: IOS_BUNDLE_ID (must match the app registered in App Store Connect)
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64 IOS_BUNDLE_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set bundle identifier
        run: sed -i '' "s/com\.example\.playlistSorterApp/${IOS_BUNDLE_ID}/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Place App Store Connect API key
        run: |
          mkdir -p private_keys
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build Flutter app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive
        run: |
          xcodebuild archive CODE_SIGNING_ALLOWED=NO \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/ios/Runner.xcarchive

      - name: Export signed IPA
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios -f "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
