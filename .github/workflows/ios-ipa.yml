name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry playlist_sorter-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: playlist_sorter-unsigned-ipa
          path: build/ipa/playlist_sorter-unsigned.ipa
          retention-days: 14
